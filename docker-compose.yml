services:
    cloud-game:
        build: .
        image: cloud-game-local
        container_name: cloud-game-local
        depends_on:
            - xvfb
        environment:
            - DISPLAY=:99
            - MESA_GL_VERSION_OVERRIDE=4.5
            - CLOUD_GAME_WEBRTC_SINGLEPORT=8443
            # local development: announce the published UDP port on localhost
            - CLOUD_GAME_WEBRTC_ICEIPMAP=127.0.0.1
            - CLOUD_GAME_COORDINATOR_DEBUG=true
            - CLOUD_GAME_WORKER_DEBUG=true
            - CLOUD_GAME_ENCODER_VIDEO_CODEC=vp8
            # accounts database (persisted in the belko-data volume)
            - CLOUD_GAME_COORDINATOR_AUTH_DBPATH=/data/belko.db
            # downloaded game covers (kept in the same persistent volume)
            - CLOUD_GAME_COORDINATOR_COVERS_DIR=/data/covers
            - CLOUD_GAME_COORDINATOR_TOURNAMENTS_REPLAYDIR=/data/replays
            # initial password of wenderson@belko.com.br (first start only),
            # set it in the .env file; if empty it is generated and printed to the log
            - CLOUD_GAME_COORDINATOR_AUTH_ADMINPASSWORD=${BELKO_ADMIN_PASSWORD:-}
            # - PION_LOG_TRACE=all
        ports:
            - "8000:8000"
            - "9000:9000"
            - "8443:8443/udp"
        command: >
            bash -c "./coordinator & while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.1; done; ./worker"
        volumes:
            - ./assets/cores:/usr/local/share/cloud-game/assets/cores
            - ./assets/games:/usr/local/share/cloud-game/assets/games
            # PS1 BIOS (scph5501.bin etc.) -- the libretro system directory
            - ./assets/bios:/usr/local/share/cloud-game/libretro/system
            # live frontend files for development (remove in production)
            - ./web:/usr/local/share/cloud-game/web
            - x11:/tmp/.X11-unix
            - belko-data:/data

    xvfb:
        image: kcollins/xvfb:latest
        entrypoint: ["sh", "-c"]
        command:
            [
                "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 && exec Xvfb :99 -screen 0 320x240x16",
            ]
        volumes:
            - x11:/tmp/.X11-unix

volumes:
    x11:
    belko-data:
