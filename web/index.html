<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#0b0d14"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="robots" content="noindex"/>
    <meta name="description" content="Belko Arcade — jogos retrô na nuvem, com os amigos."/>
    <title>Belko Arcade</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="css/tokens.css?v=4" rel="stylesheet"/>
    <link href="css/base.css?v=4" rel="stylesheet"/>
    <link href="css/app.css?v=4" rel="stylesheet"/>
    <link href="css/game.css?v=4" rel="stylesheet"/>
</head>
<body>
<header class="topbar">
    <a class="logo" href="#/biblioteca" id="logo" aria-label="Belko Arcade — início"></a>
    <nav class="topnav" id="topnav" aria-label="Navegação principal"></nav>
    <div class="topbar-right">
        <button class="queue-pill" id="queue-pill" hidden></button>
        <span class="server-status" id="server-status" title="Servidores de jogo"></span>
        <button class="user-button" id="user-button" aria-haspopup="menu"></button>
    </div>
</header>

<main>
    <section id="view-library" class="view" data-route="biblioteca"></section>
    <section id="view-live" class="view" data-route="ao-vivo" hidden></section>
    <section id="view-tournaments" class="view" data-route="torneios" hidden></section>
    <section id="view-admin" class="view" data-route="admin" hidden></section>
</main>

<section id="view-game" class="game" hidden aria-label="Partida">
    <div id="stage" class="stage" tabindex="-1">
        <video id="stream" class="game-screen" hidden muted playsinline preload="none"></video>
        <canvas id="mirror-stream" class="game-screen" hidden></canvas>
        <div id="play-stream" class="play-stream" hidden>
            <span class="btn primary lg">Clique para começar</span>
        </div>
    </div>
</section>

<script type="importmap">
    {
      "imports": {
        "api": "./js/api.js?v=4",
        "event": "./js/event.js?v=4",
        "input": "./js/input/input.js?v=4",
        "log": "./js/log.js?v=4",
        "network": "./js/network/network.js?v=4",
        "settings": "./js/settings.js?v=4",
        "utils": "./js/utils.js?v=4"
      }
    }
</script>

<script type="module" src="js/app.js?v=4"></script>

{{if .Analytics.Inject}}
<script async src="https://www.googletagmanager.com/gtag/js?id={{.Analytics.Gtag}}"></script>
<script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
        dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', '{{.Analytics.Gtag}}');
</script>
{{end}}
</body>
</html>
